/* ---------- colors: everything follows the wallpaper's main color ---------- */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function parseHex(c){const n=parseInt(c.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0,s=0;const l=(mx+mn)/2;
  if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60}return [h,s,l]}
function hsl2hex(h,s,l){h=((h%360)+360)%360;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,"0")};return "#"+f(0)+f(8)+f(4)}
function lum(hex){const [r,g,b]=parseHex(hex).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
let ICOL={c1:"#d9487f",c2:"#9b55d6"};
function setBaseColor(hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex||"")) return;
  const [h,s0,l0]=rgb2hsl(...parseHex(hex)); const s=s0<.12?s0:clamp(s0,.45,.9);
  const a=hsl2hex(h,s,.64), b=hsl2hex(h+18,s,.82);
  ICOL={c1:hsl2hex(h,s,.5),c2:hsl2hex(h+24,s,.38)};
  const r=document.documentElement.style;
  r.setProperty("--accent",a); r.setProperty("--accent2",b); r.setProperty("--on-accent",lum(a)>.38?"#14141c":"#ffffff");
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=ICOL.c2;
  refreshIcons();
}
function ico(id){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+ICOL.c1+'"/><stop offset="1" stop-color="'+ICOL.c2+'"/></linearGradient></defs><rect x="4" y="4" width="92" height="92" rx="24" fill="url(#g)"/>'+(GLYPH[id]?'<g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+GLYPH[id]+'</g>':'<text x="50" y="68" font-size="52" text-anchor="middle">'+(FLStore.emoji[id]||"")+'</text>')+'</svg>';
  return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}
function refreshIcons(){document.querySelectorAll("img[data-ico]").forEach(i=>{i.src=ico(i.dataset.ico)})}
function dominant(im){
  const c=document.createElement("canvas"),S=40;c.width=c.height=S;const x=c.getContext("2d");x.drawImage(im,0,0,S,S);
  const d=x.getImageData(0,0,S,S).data, bk=Array.from({length:12},()=>({w:0,r:0,g:0,b:0})); let tr=0,tg=0,tb=0;
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];tr+=r;tg+=g;tb+=b;const [h,s,l]=rgb2hsl(r,g,b);
    if(s<.2||l<.12||l>.9) continue; const w=s*(1-Math.abs(2*l-1)), k=Math.floor(h/30)%12; const o=bk[k]; o.w+=w;o.r+=r*w;o.g+=g*w;o.b+=b*w}
  let best=null; for(const o of bk) if(!best||o.w>best.w) best=o;
  const px=d.length/4; const col=best&&best.w>0?[best.r/best.w,best.g/best.w,best.b/best.w]:[tr/px,tg/px,tb/px];
  return "#"+col.map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
}

function applyWall(i){
  const w=WALLS[i]; if(!w) return;
  document.documentElement.style.setProperty("--wallpaper",w.v);
  setBaseColor(w.a); store.set("gx-wall-v2",i); store.set("px-wall-mode","preset");
}
function applyPicture(src,cachedColor){
  document.documentElement.style.setProperty("--wallpaper",'url("'+String(src).replace(/"/g,"%22")+'")');
  if(cachedColor) setBaseColor(cachedColor);
  const im=new Image(); if(!/^data:/.test(src)) im.crossOrigin="anonymous";
  im.onload=()=>{try{const hex=dominant(im);store.set("px-wall-accent",hex);setBaseColor(hex)}catch(e){}};
  im.src=src;
}
function applyTheme(t){
  if(t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",t);
  store.set("gx-theme",t);
}
function shrink(im,max,q){const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}
function savePic(url){try{localStorage.setItem("px-wall-img",url);localStorage.setItem("px-wall-mode","img");return true}catch(e){return false}}
function handleFile(f,done){
  if(!f||!/^image\//.test(f.type)) return toast("Pick an image file");
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{let url=shrink(im,1920,.86);
      if(!savePic(url)){url=shrink(im,1280,.7); if(!savePic(url)) toast("Applied, but it's too big to remember next time");}
      applyPicture(url); done&&done()};
    im.onerror=()=>toast("Couldn't read that picture"); im.src=r.result};
  r.readAsDataURL(f);
}
function applyUrl(u,done){
  u=(u||"").trim(); if(!/^https?:\/\//i.test(u)) return toast("Paste a link that starts with https://");
  const t=new Image(); t.onload=()=>{store.set("px-wall-url",u);store.set("px-wall-mode","url");applyPicture(u);done&&done()}; t.onerror=()=>toast("That link isn't a picture I can load"); t.src=u;
}
(function boot(){
  applyTheme(store.get("gx-theme","auto"));
  const mode=store.get("px-wall-mode","preset"), img=store.get("px-wall-img",""), url=store.get("px-wall-url","");
  if(mode==="img"&&img) applyPicture(img,store.get("px-wall-accent",""));
  else if(mode==="url"&&url) applyPicture(url,store.get("px-wall-accent",""));
  else applyWall(+store.get("gx-wall-v2",0)||0);
})();

/* ---------- falling petals (optional) ---------- */
const petals=(function(){
  const c=$("#petals"),x=c.getContext("2d"),cols=["255,183,213","255,160,200","255,205,225","250,140,185","255,224,236"];
  let ps=[],W=0,H=0,raf=0;
  function make(top){const s=Math.random()*7+6;return{x:Math.random()*W,y:top?-20-Math.random()*40:Math.random()*H,s,vy:Math.random()*.7+.5,sway:Math.random()*1.4+.6,sp:Math.random()*.02+.008,ph:Math.random()*6.28,rot:Math.random()*6.28,vr:(Math.random()-.5)*.03,flip:Math.random()*6.28,vf:Math.random()*.04+.01,col:cols[(Math.random()*cols.length)|0],a:Math.random()*.35+.55}}
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);const n=Math.round(Math.min(40,Math.max(14,W/30)));while(ps.length<n)ps.push(make(false));ps.length=n}
  function petal(p){const s=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.scale(Math.cos(p.flip)*.8+.2,1);const g=x.createLinearGradient(0,-s,0,s);g.addColorStop(0,"rgba("+p.col+","+p.a+")");g.addColorStop(1,"rgba(255,255,255,"+(p.a*.75)+")");x.fillStyle=g;x.beginPath();x.moveTo(0,-s);x.bezierCurveTo(s*.95,-s*.6,s*.7,s*.7,0,s);x.bezierCurveTo(-s*.7,s*.7,-s*.95,-s*.6,0,-s);x.fill();x.restore()}
  function frame(){x.clearRect(0,0,W,H);for(let i=0;i<ps.length;i++){const p=ps[i];p.ph+=p.sp;p.y+=p.vy;p.x+=Math.sin(p.ph)*p.sway*.5+.25;p.rot+=p.vr;p.flip+=p.vf;if(p.y>H+20||p.x>W+30){ps[i]=make(true);if(Math.random()<.5)ps[i].x=Math.random()*W}petal(p)}raf=requestAnimationFrame(frame)}
  addEventListener("resize",()=>{if(raf)size()});
  return{set(on){cancelAnimationFrame(raf);raf=0;c.style.display=on?"block":"none";if(on){size();frame()}else x.clearRect(0,0,c.width,c.height)}};
})();
petals.set(store.get("px-petals","0")==="1");

const wins={}; let order=[], activeId=null, offset=0;
const ICN={min:'<svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg>',max:'<svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg>',res:'<svg viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5v-2h7v7h-2"/></svg>',x:'<svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg>'};

  document.querySelectorAll("[data-tb]").forEach(b=>{const id=b.dataset.tb,w=wins[id];b.classList.toggle("open",!!w);b.classList.toggle("active",!!w&&id===activeId&&w.style.display!=="none")});
}

function restoreApp(id){const w=wins[id];if(!w)return;w.style.display="";focusApp(id)}
function closeApp(id){
  const w=wins[id]; if(!w) return; if(w._end)w._end(); w.classList.add("closing");
  setTimeout(()=>w.remove(),150); delete wins[id]; order=order.filter(x=>x!==id);
  if(activeId===id){activeId=null;for(let i=order.length-1;i>=0;i--){const o=wins[order[i]];if(o&&o.style.display!=="none"){activeId=order[i];break}}}
  syncTaskbar();
}

        try{navigator.clipboard.writeText(link)}catch(e){}
        const win=window.open(link,"_blank");
        toast(win?("Sent "+Object.keys(d).length+" settings"+(skipped.length?" (a big uploaded wallpaper was skipped)":"")):"Pop-up blocked — the move link was copied; paste it into a new tab");
      }
      if(a.dataset.act==="bk-copy"){
        const {d,skipped}=flDump(), code=flEnc(d);
        const ok=()=>toast("Backup code copied ("+Object.keys(d).length+" settings"+(skipped.length?", big wallpaper skipped":"")+"). Paste it on your new link → Restore");
        const fb=()=>{const t=document.createElement("textarea");t.value=code;document.body.appendChild(t);t.select();let r=false;try{r=document.execCommand("copy")}catch(e){}t.remove();r?ok():(w.querySelector("#bk-in").value=code,toast("Copy blocked — the code is in the box; select it and copy"))};
        try{navigator.clipboard.writeText(code).then(ok,fb)}catch(e){fb()}
      }
      if(a.dataset.act==="bk-restore"){
        let v=(w.querySelector("#bk-in").value||"").trim(); const m=v.match(/#fl-move=(.+)$/); if(m) v=m[1];
        try{const d=flDec(v); let n=0; for(const k in d){localStorage.setItem(k,d[k]);n++} toast("Restored "+n+" settings — reloading…"); setTimeout(()=>location.reload(),900)}
        catch(e){toast("That code didn't work — copy the whole thing")}
      }
      if(a.dataset.act==="blank"){ if(!(window.launchBlank&&launchBlank())) toast("Pop-up blocked — allow pop-ups for this site"); }
    }
  });
  w.addEventListener("change",e=>{
    if(e.target.id==="wp-file"){handleFile(e.target.files[0],redo)}
    if(e.target.id==="blank-tog"){store.set("px-autoblank",e.target.checked?"1":"0");toast(e.target.checked?"Will auto-open in about:blank":"Will open normally")}
    if(e.target.id==="petal-tog"){store.set("px-petals",e.target.checked?"1":"0");petals.set(e.target.checked)}
  });
  function redo(){ if(id==="settings"){const b=w.querySelector(".win-body");b.innerHTML=body("settings")} }
}

/* ---------- taskbar, desktop, start menu ---------- */
const TB_IDS=["browser","books","geforce","pyrite","ripple","social","store","settings"];
$("#tbapps").innerHTML=TB_IDS.map(id=>{const a=APPS.find(x=>x.id===id);return `<button class="tbb" data-tb="${id}" title="${a.name}" aria-label="${a.name}"><img data-ico="${id}" src="${ico(id)}" alt=""></button>`}).join("");
$("#tbapps").addEventListener("click",e=>{
  const b=e.target.closest("[data-tb]"); if(!b) return; const id=b.dataset.tb,w=wins[id];
  closeStart();
  if(!w) openApp(id); else if(w.style.display==="none") restoreApp(id); else if(activeId===id) minimizeApp(id); else focusApp(id);
});
function renderDesktop(){$("#desktop").innerHTML=APPS.filter(isVis).map(a=>`<button class="dicon" data-d="${a.id}"><img data-ico="${a.id}" src="${ico(a.id)}" alt=""><span>${a.name}</span></button>`).join("")}
renderDesktop();
let lastPtr="mouse";
$("#desktop").addEventListener("pointerdown",e=>{lastPtr=e.pointerType||"mouse"});
$("#desktop").addEventListener("click",e=>{
  const b=e.target.closest("[data-d]"); closeStart();
  document.querySelectorAll(".dicon").forEach(x=>x.classList.toggle("sel",x===b));
  if(b&&(lastPtr==="touch"||lastPtr==="pen"||e.detail>=2)) openApp(b.dataset.d);
});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".dicon")) document.querySelectorAll(".dicon.sel").forEach(x=>x.classList.remove("sel"))});

const startEl=$("#start"), sInput=$("#ssearch");
function renderStart(q){
  q=(q||"").trim().toLowerCase(); const list=APPS.filter(a=>isVis(a)&&(!q||a.name.toLowerCase().includes(q)));
  $("#shead").textContent=q?"Apps":"Pinned";
  $("#sgrid").innerHTML=list.length?list.map(a=>`<button class="app" data-s="${a.id}"><img data-ico="${a.id}" src="${ico(a.id)}" alt="">${a.name}</button>`).join(""):`<div class="empty">No apps match “${q.replace(/[<&]/g,"")}”.</div>`;
}
function openStart(focus){startEl.classList.add("show");sInput.value="";renderStart("");if(focus)setTimeout(()=>sInput.focus(),30);$("#startbtn").classList.add("active")}
function closeStart(){startEl.classList.remove("show");$("#startbtn").classList.remove("active")}
$("#startbtn").addEventListener("click",()=>startEl.classList.contains("show")?closeStart():openStart(false));
$("#tbsearch").addEventListener("click",()=>openStart(true));
sInput.addEventListener("input",()=>renderStart(sInput.value));
sInput.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=$("#sgrid [data-s]");if(f)openApp(f.dataset.s)}});
$("#sgrid").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(b)openApp(b.dataset.s)});
$("#sgear").addEventListener("click",()=>openApp("settings"));
document.addEventListener("pointerdown",e=>{if(startEl.classList.contains("show")&&!e.target.closest("#start,#startbtn,#tbsearch")) closeStart()});
addEventListener("keydown",e=>{if(e.key==="Escape"){if(startEl.classList.contains("show")){closeStart();return}if(activeId)closeApp(activeId)}});
refreshIcons();
</script>
<script src="/calling.js"></script>
<script>
window.addEventListener('load',()=>{if(window.__flMoved)setTimeout(()=>toast('Moved '+window.__flMoved+' settings from your old link ✓'),400)});
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(err => console.warn('Service worker registration failed:', err)));
}
</script>
